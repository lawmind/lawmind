# ─────────────────────────────────────────────────────────────────────────────
# LawMind local PostgreSQL 18 — tuning for THIS machine, not from generic advice
# ─────────────────────────────────────────────────────────────────────────────
#
# Applied by scripts/migration/pg-local.mjs as an include from postgresql.conf.
# Kept in the repo rather than only in C:\lawmind\pgdata because a data
# directory is not version-controlled and a tuning decision that exists only on
# one disk is a decision nobody can review.
#
# THE MACHINE, measured 15 Aug 2026:
#   CPU   Intel i7-12700K — 12 physical cores, 20 logical
#   RAM   31.7 GB
#   DISK  C: = NVMe WD Blue SN580, 662 GB free.  D: is a SATA HDD — NOT used.
#   SRC   Railway PG 18.4 Debian, 103.9 GB, shared_buffers 128 MB (its default)
#
# The source's own settings are deliberately NOT copied. Railway ran this
# database on 128 MB of shared buffers; that is a hosting default, not a
# considered value, and inheriting it would carry the platform's constraint into
# a machine that does not have it.
#
# ─────────────────────────────────────────────────────────────────────────────

# ── Connections ──────────────────────────────────────────────────────────────
# LOCALHOST ONLY. The founder directive is explicit: do NOT expose PostgreSQL
# publicly. External access, if it is ever wanted, goes through cloudflared to
# the HTTP API — never to port 5432.
listen_addresses = 'localhost'
port = 5432

# 100 matches the source. The ingest fleet ran ~36 backends against Railway, so
# there is headroom, and every connection reserves work_mem-sized allocations.
max_connections = 100

# ── Memory ───────────────────────────────────────────────────────────────────
# 2 GB, NOT the 25%-of-RAM rule of thumb, and the rule of thumb was tried first
# and REFUSED BY THE OPERATING SYSTEM. Both reasons are worth keeping:
#
# 1. MEASURED. shared_buffers = 8GB fails to start on this machine:
#      FATAL: could not create shared memory segment: error code 1450
#      DETAIL: CreateFileMapping(size=8853479424, ...)
#    1450 is ERROR_NO_SYSTEM_RESOURCES. Windows backs shared memory against the
#    system commit limit, which is 48.9 GB here with 41.9 GB already committed
#    by the ingest fleet and the agent sessions — about 7 GB of headroom, not
#    the 8 GB being asked for. This is a commit-charge limit, not a RAM limit,
#    and no amount of free physical memory changes it.
#
# 2. It would be the wrong value even if it had started. The PostgreSQL manual
#    says so directly for this platform: on Windows, large shared_buffers are
#    not as effective, and the recommendation is to keep the setting relatively
#    low and let the operating system cache do the work. That is not a
#    workaround for the error above — it is the same conclusion by a second
#    road, which is why 2 GB is written here rather than "as much as fits".
shared_buffers = 2GB

# What the planner believes the OS will have cached, across shared_buffers AND
# the Windows file cache. Not an allocation. Sized against the ~12 GB this
# machine actually has free once the fleet is running, not against the 31.7 GB
# it has installed.
effective_cache_size = 12GB

# 32 MB per sort/hash node, not per connection — a single query with several
# such nodes multiplies it. Conservative on purpose: the restore raises it per
# session where it actually helps rather than globally.
work_mem = 32MB

# Index builds and VACUUM. 512 MB because pg_restore --jobs=N gives EACH worker
# its own allowance and this machine's constraint is commit charge, not RAM:
# 4 jobs x 1 GB in restore-mode = 4 GB peak, which fits inside the headroom
# measured above. The "obvious" 4 GB would be 16 GB peak and would fail to
# start the same way shared_buffers did.
maintenance_work_mem = 512MB

# Parallel index builds get their own multiplier on top of the above.
max_parallel_maintenance_workers = 4

# ── Parallelism ──────────────────────────────────────────────────────────────
# 20 logical cores. Left below the core count so a saturating query cannot
# starve the API and the ingest workers sharing this machine.
max_worker_processes = 20
max_parallel_workers = 12
max_parallel_workers_per_gather = 4

# ── Disk ─────────────────────────────────────────────────────────────────────
# NVMe: a random page costs very nearly what a sequential one costs. The 4.0
# default encodes a spinning disk and pushes the planner toward seq scans over
# index scans, which is the wrong call on this hardware.
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# ── WAL / checkpoints ────────────────────────────────────────────────────────
# Railway ran max_wal_size = 1 GB. Restoring 104 GB against that would
# checkpoint continuously and spend the restore writing full-page images.
max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9
wal_compression = zstd

# ON, and this is a deliberate reversal of the restore-time setting. The whole
# point of this migration is that the local machine now holds the data moat; a
# power cut that silently loses the last second of committed enrichment is not
# a trade worth making for a database that no longer has a cloud copy.
# scripts/migration/pg-local.mjs turns it OFF for the restore only, where every
# byte is reproducible from the archive, and back ON before cutover.
synchronous_commit = on

# ── Autovacuum ───────────────────────────────────────────────────────────────
# judgment_paragraphs is 26.6M rows and judgments is 6.4M. The 0.2 default
# means a fifth of the table must be dead before a vacuum starts — that is
# 5.3M dead tuples on one table. Scaled down, with the workers to keep up.
autovacuum_max_workers = 4
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000

# ── Observability ────────────────────────────────────────────────────────────
# The stuck-backend incident (pid 62315, 19.8 hours, documented in
# docs/ops/UNBLOCK_CITATION_RESOLVER.sql) went unnoticed for most of a day.
# These are what would have surfaced it within the hour.
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 10s
log_checkpoints = on
log_lock_waits = on
log_autovacuum_min_duration = 1min
log_line_prefix = '%m [%p] %q%u@%d '

# A transaction idle in a transaction block for an hour is holding row locks and
# pinning the xmin horizon. There is no legitimate LawMind workload that does
# this; the resolver incident is what it looks like when one does.
idle_in_transaction_session_timeout = 1h

# NOT set: statement_timeout. Enrichment passes and index builds legitimately
# run for hours, and a global cap would kill them. Long queries are LOGGED
# (above) so they are visible, which is the actual requirement.

# ── Locale ───────────────────────────────────────────────────────────────────
# The database was created with the ICU provider and locale en-US. The source is
# libc en_US.utf8, which does not exist on Windows at all, so an exact match was
# never available and ICU en-US is the closest thing that does.
#
# Why this is safe rather than merely convenient, checked rather than assumed:
# the source schema has ZERO columns, indexes or constraints with an explicit
# COLLATE clause, so nothing in the dump names a collation that must resolve.
# Both providers are deterministic, so text equality and every UNIQUE constraint
# behave identically. What differs is ORDER BY ordering on text, and pg_restore
# rebuilds every index under the new collation so indexes and queries stay
# consistent with each other.
default_text_search_config = 'pg_catalog.english'
timezone = 'UTC'
