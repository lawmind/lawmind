name: CI

# **Runs on every push to `main` and on every pull request.**
#
# It did not, and the reason it did not is now false. Until 18 September 2026
# the block here said this was a private repository on 2,000 Actions minutes a
# month and that pushing 20 times a day would spend the month in a week. The
# repository is PUBLIC (`gh repo view --json visibility` → `PUBLIC`), and
# GitHub's current billing documentation is explicit: "The use of standard
# GitHub-hosted runners is free: In public repositories."
# (docs.github.com/en/billing/concepts/product-billing/github-actions, read
# 18 Sep 2026.) LARGER runners are still charged "even when used by public
# repositories", which is why every job below pins `ubuntu-latest` and nothing
# here selects a larger runner.
#
# So the minute budget that justified withholding CI from `push` does not exist,
# and the cost of NOT running it does: between 7 August and 18 September 2026 no
# workflow ran at all, and `pnpm format` drifted red across hundreds of files
# with nothing to say so.
#
# `pnpm ci:local` is unchanged and still the fast pre-push check — the same steps
# in the same order, against a throwaway database, in about 60 seconds. It is not
# a lesser check; it is the same check, earlier. CI is now the one that also runs
# when nobody remembers to.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. Without this a superseded push queues behind the run it
# replaced, and on a branch with several commits a minute that is most of the
# queue waiting on results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server checks
    runs-on: ubuntu-latest
    # Fail fast rather than sitting in a queue. This job takes ~5 minutes when a
    # runner picks it up; if it has not finished in 15 something is wrong with the
    # infrastructure, not the code, and a stuck job should say so quickly.
    timeout-minutes: 15

    services:
      # Postgres 16 + pgvector, matching DEPLOYMENT.md. The migrations create the
      # extension themselves and fail loudly if it is unavailable.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lawmind
          POSTGRES_PASSWORD: lawmind
          POSTGRES_DB: lawmind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lawmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lawmind:lawmind@127.0.0.1:5432/lawmind_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Before install, because it needs neither dependencies nor a database and
      # a wrong contract is the cheapest failure here to find. The status column
      # in docs/API_CONTRACTS.md must match the routes app.ts mounts — RCC reads
      # that file as the description of the server, and once did so correctly
      # about an endpoint that had never been built.
      - run: node scripts/check-contract-status.mjs
      # Every table SCHEMA_TRUTH.md describes must exist in a migration. Three
      # did not, and all three typechecked clean before failing on real
      # Postgres. Runs before install: needs neither deps nor a database.
      - run: node scripts/check-schema-truth.mjs
      # Does the product PROMISE an alert it cannot deliver? Replaces
      # `check-alert-coverage.mjs`, which asked whether all four PD-5 triggers can
      # fire — two cannot, because monitoring and uploads are DISABLED by decision,
      # so it was red on every run from 11 Aug 2026 and the only ways to green it
      # were to build capabilities the founder has not scoped or to delete it. It is
      # now `scripts/check-pd5-alerts-readiness.mjs`, a FUTURE readiness gate, and
      # deliberately not a current-v1 CI requirement. This guard asks the question
      # current v1 has to answer, and it caught four shipped promises on its first
      # run: "Four things", an "evening briefing" while the briefing is disabled, a
      # mandatory always-ON switch for a trigger needing POST_V1 export, and a push
      # permission prompt for a channel with no project id.
      - run: node scripts/check-alert-surface-truth.mjs
      # Bootstrap files must point at the current roadmap (v7.4), the live
      # docs/CURRENT_STATE.md and the SHIP/DATA/RED lanes. They drifted three
      # versions stale silently before 18 Sep 2026. Reads active files only,
      # never history. Needs neither deps nor a database.
      - run: node scripts/lawmind-authority-check.mjs

      # apps/** still carries npm lockfiles; installing it here would make this
      # job red for reasons outside the server workspaces it checks. Flagged,
      # not converged.
      - run: pnpm install --frozen-lockfile --filter "!./apps/*"

      - run: pnpm lint
      - run: pnpm format
      # Filter by PATH, never by the `@lawmind/*` name glob: the npm scope covers
      # the whole repository, so the glob also selects @lawmind/admin and
      # @lawmind/mobile — whose dependencies the install step above deliberately
      # skips. That mismatch is what made the first CI run red.
      - run: pnpm --filter "./services/*" --filter "./packages/*" typecheck

      # Against a fresh database every run: proves the migrations apply on empty.
      - run: pnpm --filter @lawmind/db migrate
      # And that a second run is a no-op.
      - run: pnpm --filter @lawmind/db migrate

      - run: pnpm --filter "./services/*" --filter "./packages/*" test

      # The lane bus carries every cross-agent message and had no test until it
      # had already shipped two message-destroying bugs. Needs no database and
      # runs in about a second; it ran only in `ci:local` until 18 Sep 2026,
      # which is exactly the gap that let the rest of this file go stale unseen.
      - run: bash scripts/lane-bus.test.sh

  design-rules:
    name: design rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deliberately its own job. It needs no database and no install, and a
    # delivered render should be checkable the moment it lands rather than
    # after somebody builds against it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Four renders across two deliveries contradicted rules that were already
      # written down, and three of the four were mechanically checkable. The
      # client lane was catching them one at a time, downstream, after building.
      # This is the gate that should have caught them at zero cost.
      - run: node scripts/check-design-rules.mjs
      # The inventory against the filesystem. A table nobody checks is a table
      # that lies, and this one lied in both directions inside a week.
      - run: node scripts/check-design-renders.mjs design/screens
      # Amber #B4690E means THE LAW HAS MOVED and nothing else. Its power comes
      # entirely from being the only place the colour appears — once it means two
      # things it means nothing, and the dilution is invisible until it costs
      # somebody a case. Added 11 Aug 2026, red on two files in apps/** the first
      # time it was run. The stale-overruled threshold is zero; this is the
      # colour that carries it.
      - run: node scripts/check-amber-reservation.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # DEPLOYED SAFETY — separate on purpose, and NOT_RUN is not a pass
  # ───────────────────────────────────────────────────────────────────────────
  #
  # Every step in `server checks` runs against the scratch Postgres this
  # workflow provisions. None of them calls the deployed service, and that gap
  # is what let a citation-shaped query fall through to semantic search in
  # production for three days after the fix was already on `origin/main`
  # (docs/ai/tasks/001-p0-citation-query-safety.md).
  #
  # The probe used to live inside the server job with a hard-coded default of
  # `https://api-production-1c0b4.up.railway.app`. That origin is RETIRED. As of
  # 18 Sep 2026 `PRODUCTION = NONE` and `PERSISTENT_BETA = NONE`
  # (docs/CURRENT_STATE.md §11), so there is no deployment to grade and no
  # honest default to fall back to — a probe that invents a target reports on a
  # host nobody deployed, in language that reads like a report about LawMind.
  #
  # So the target is CONFIGURATION. Set the repository/environment variable
  # `PROBE_BASE_URL` (Settings → Secrets and variables → Actions → Variables)
  # and this job runs; leave it unset and this job says, in one machine-readable
  # line, that it DID NOT RUN. Neither state is a pass. SHIP S4-R1 sets the
  # variable when the persistent beta exists, and the probe becomes a
  # deployment-acceptance gate again with none of its assertions touched.
  deployed-safety:
    # The DISPLAY NAME carries the state, because a green tick beside the words
    # "deployed safety" is exactly the misreading this job exists to prevent.
    # With no target the job is correct-and-skipped, not passing, and the run
    # summary now says so without anyone opening the log.
    name: ${{ vars.PROBE_BASE_URL != '' && 'deployed safety' || 'deployed safety (NOT_RUN_NO_DEPLOYED_TARGET)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: No deployed target
        if: vars.PROBE_BASE_URL == ''
        run: |
          echo "DEPLOYED_SAFETY=NOT_RUN_NO_DEPLOYED_TARGET" >> "$GITHUB_OUTPUT"
          echo "DEPLOYED_SAFETY=NOT_RUN_NO_DEPLOYED_TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "NOT_RUN_NO_DEPLOYED_TARGET — repository variable PROBE_BASE_URL is unset."
          echo "PRODUCTION = NONE and PERSISTENT_BETA = NONE; see docs/CURRENT_STATE.md."
          echo "This is neither a pass nor a failure. Do not read it as either."

      - uses: actions/checkout@v4
        if: vars.PROBE_BASE_URL != ''
      - uses: pnpm/action-setup@v4
        if: vars.PROBE_BASE_URL != ''
      - uses: actions/setup-node@v4
        if: vars.PROBE_BASE_URL != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "!./apps/*"
        if: vars.PROBE_BASE_URL != ''

      # Assertions unchanged: exact match → exact case, zero match → zero or an
      # explicit not-found, and the one thing that must never happen — a
      # citation that fails to resolve falling through to semantic search and
      # returning a plausible different case.
      - name: Citation safety probe
        if: vars.PROBE_BASE_URL != ''
        env:
          PROBE_BASE_URL: ${{ vars.PROBE_BASE_URL }}
        run: pnpm citation-safety-probe
