name: CI

# **Deliberately NOT on every push.**
#
# This is a private repo on the free tier: 2,000 Actions minutes a month, and the
# founder's decision is that we do not buy more. At ~5 minutes a run across two
# jobs, pushing 20 times in a working day would spend the month in a week.
#
# What replaces it is `pnpm ci:local` — the same steps, the same order, against a
# throwaway database, in about 60 seconds and for nothing. It has already caught
# three real defects that would otherwise have gone to a queue: an unused
# variable, a missing import, and a NUL byte in a source file. **Run it before
# every push.** It is not a lesser check; it is the same check, earlier.
#
# So CI runs where a human is about to read the result — on a pull request, and on
# demand — rather than on every commit to a branch only one agent is working on.
on:
  pull_request:
  workflow_dispatch:

# One run per ref. Without this a superseded push queues behind the run it
# replaced and both bill.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server lane
    runs-on: ubuntu-latest
    # Fail fast rather than sitting in a queue. This job takes ~5 minutes when a
    # runner picks it up; if it has not finished in 15 something is wrong with the
    # infrastructure, not the code, and a stuck job should say so quickly.
    timeout-minutes: 15

    services:
      # Postgres 16 + pgvector, matching DEPLOYMENT.md. The migrations create the
      # extension themselves and fail loudly if it is unavailable.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lawmind
          POSTGRES_PASSWORD: lawmind
          POSTGRES_DB: lawmind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lawmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lawmind:lawmind@127.0.0.1:5432/lawmind_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Before install, because it needs neither dependencies nor a database and
      # a wrong contract is the cheapest failure here to find. The status column
      # in docs/API_CONTRACTS.md must match the routes app.ts mounts — RCC reads
      # that file as the description of the server, and once did so correctly
      # about an endpoint that had never been built.
      - run: node scripts/check-contract-status.mjs
      # Every table SCHEMA_TRUTH.md describes must exist in a migration. Three
      # did not, and all three typechecked clean before failing on real
      # Postgres. Runs before install: needs neither deps nor a database.
      - run: node scripts/check-schema-truth.mjs
      # PD-5 and PD-6 promise four alert kinds; `alert_kind` holds two. The app
      # persists switches for notifications the system cannot produce. Added
      # 11 Aug 2026 after this guard was found running NOWHERE — not here, not in
      # ci-local, not in a test suite — and red the first time anyone ran it.
      - run: node scripts/check-alert-coverage.mjs

      # apps/** is RCC's lane and still carries npm lockfiles; installing it here
      # would make this job red for reasons outside this lane. Flagged, not converged.
      - run: pnpm install --frozen-lockfile --filter "!./apps/*"

      - run: pnpm lint
      - run: pnpm format
      # Filter by PATH, never by the `@lawmind/*` name glob: the scope is shared
      # across both lanes, so the glob also selects @lawmind/admin and
      # @lawmind/mobile — whose dependencies the install step above deliberately
      # skips. That mismatch is what made the first CI run red.
      - run: pnpm --filter "./services/*" --filter "./packages/*" typecheck

      # Against a fresh database every run: proves the migrations apply on empty.
      - run: pnpm --filter @lawmind/db migrate
      # And that a second run is a no-op.
      - run: pnpm --filter @lawmind/db migrate

      - run: pnpm --filter "./services/*" --filter "./packages/*" test

      # docs/ai/tasks/001-p0-citation-query-safety.md — the gate every other
      # step in this job cannot provide: it calls the DEPLOYED service over
      # plain HTTP, never the scratch Postgres container above. Added 11 Aug
      # 2026 after a citation-shaped query fell through to semantic search in
      # production for three days while every other check here stayed green,
      # because none of them had ever looked at the running service — a
      # citation that cannot exist returned five real Supreme Court
      # authorities and nothing said the query was not understood. Defaults to
      # production (`PROBE_BASE_URL` to point elsewhere) and is deliberately
      # red until the fix already on `origin/main` is deployed there.
      - run: pnpm citation-safety-probe

  design-rules:
    name: design rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deliberately its own job. It needs no database, no install and no lane, and
    # a delivered render should be checkable the moment it lands rather than
    # after somebody builds against it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Four renders across two deliveries contradicted rules that were already
      # written down, and three of the four were mechanically checkable. The
      # client lane was catching them one at a time, downstream, after building.
      # This is the gate that should have caught them at zero cost.
      - run: node scripts/check-design-rules.mjs
      # The inventory against the filesystem. A table nobody checks is a table
      # that lies, and this one lied in both directions inside a week.
      - run: node scripts/check-design-renders.mjs design/screens
      # Amber #B4690E means THE LAW HAS MOVED and nothing else. Its power comes
      # entirely from being the only place the colour appears — once it means two
      # things it means nothing, and the dilution is invisible until it costs
      # somebody a case. Added 11 Aug 2026, red on two files in apps/** the first
      # time it was run. The stale-overruled threshold is zero; this is the
      # colour that carries it.
      - run: node scripts/check-amber-reservation.mjs
